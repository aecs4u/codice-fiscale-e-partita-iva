<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17324d">
    <title>{% block title %}Codice Fiscale e Partita IVA{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #17324d;
            --muted: #526477;
            --accent: #155eef;
            --accent-dark: #1247b8;
            --surface: #fff;
            --page: #f3f6fa;
        }
        body { background: var(--page); color: var(--ink); }
        .navbar { background: var(--ink); }
        .hero-section { background: var(--ink); color: #fff; padding: 3.25rem 0 5rem; }
        .hero-section p { color: #e4ebf3; }
        .hero-section .eyebrow { color: #b7d1ff; letter-spacing: .08em; text-transform: uppercase; }
        .app-shell { margin-top: -2.5rem; }
        .tool-card, .notice-card { background: var(--surface); border: 1px solid #dce4ed; border-radius: 1rem; box-shadow: 0 8px 28px rgb(23 50 77 / 7%); }
        .tool-card { padding: clamp(1rem, 3vw, 2rem); }
        .nav-pills .nav-link { color: var(--ink); border: 1px solid transparent; }
        .nav-pills .nav-link.active { background: var(--accent); color: #fff; }
        .task-tabs { border-bottom: 1px solid #dce4ed; gap: .5rem; }
        .task-tabs .nav-link { border-radius: .5rem .5rem 0 0; }
        .task-tabs .nav-link.active { color: var(--accent); background: #fff; border-color: #dce4ed #dce4ed #fff; font-weight: 600; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover, .btn-primary:focus { background: var(--accent-dark); border-color: var(--accent-dark); }
        .form-control:focus, .form-select:focus, .btn:focus-visible, .nav-link:focus-visible, summary:focus-visible {
            border-color: var(--accent);
            box-shadow: 0 0 0 .22rem rgb(21 94 239 / 22%);
            outline: 0;
        }
        .form-label { font-weight: 600; }
        .text-muted { color: var(--muted) !important; }
        .result-box { border-radius: .65rem; margin-top: 1rem; padding: 1rem; }
        .result-success { background: #eaf7ef; border: 1px solid #a9d9b8; color: #174b2a; }
        .result-error { background: #fff0f0; border: 1px solid #edb3b3; color: #742525; }
        .result-box pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: .5rem 0 0; }
        .suggestion-list { position: absolute; z-index: 5; inset-inline: 0; max-height: 16rem; overflow-y: auto; background: #fff; border: 1px solid #aebccc; border-radius: .5rem; box-shadow: 0 .5rem 1.2rem rgb(23 50 77 / 15%); }
        .suggestion-option { display: block; width: 100%; padding: .65rem .8rem; text-align: left; background: #fff; border: 0; color: var(--ink); }
        .suggestion-option:hover, .suggestion-option[aria-selected="true"] { background: #eaf1ff; }
        .privacy-note { border-left: 4px solid #6b7c93; }
        .sr-status { min-height: 1.5rem; }
        footer { color: var(--muted); }
        [hidden] { display: none !important; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand fw-semibold" href="/">Codice Fiscale <span class="text-white-50">·</span> Partita IVA</a>
            <button class="btn btn-sm btn-outline-light" type="button" id="languageToggle" aria-label="Switch language">English</button>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4">
        <div class="container small d-flex flex-wrap justify-content-between gap-2">
            <span>python-codice_fiscale</span>
            <a href="https://github.com/aecs4u/codice-fiscale-e-partita-iva">GitHub</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
