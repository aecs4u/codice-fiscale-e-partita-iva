# Cloud Build configuration with GAR (Google Artifact Registry) authentication
# This enables Cloud Build access to private Python packages stored in Artifact Registry.
#
# Features:
# - GAR token generation for private Python packages
# - Docker BuildKit with layer caching via Artifact Registry
# - Automated deployment to Cloud Run Gen 2
#
# Generated by Lighthouse deploy.sh
# Usage: gcloud builds submit --config cloudbuild.yaml .

steps:
  # Step 1: Generate access token for Artifact Registry
  - name: "gcr.io/cloud-builders/gcloud"
    id: "generate-token"
    entrypoint: "bash"
    args:
      - "-c"
      - 'gcloud auth print-access-token > /workspace/.gar-token && echo "Token generated successfully"'

  # Step 2: Build Docker image with BuildKit caching
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        GAR_TOKEN=$$(cat /workspace/.gar-token)
        docker build \
          --build-arg GAR_TOKEN="$$GAR_TOKEN" \
          --target runtime \
          --progress=plain \
          -t europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service:latest \
          -t europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service:cache \
          -t europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service:$BUILD_ID \
          .

  # Step 3: Push to Artifact Registry (all tags including cache)
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - "push"
      - "--all-tags"
      - "europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service"

  # Step 4: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "codice-fiscale-service"
      - "--image=europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service:latest"
      - "--region=europe-west1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--max-instances=3"
      - "--min-instances=0"
      - "--concurrency=80"
      - "--execution-environment=gen2"
      - "--port=8080"
      - "--timeout=300"
      - "--cpu-boost"
      - "--cpu-throttling"
      # Non-secret config only. Secrets are injected from Secret Manager via --update-secrets below.
      - "--set-env-vars=ENVIRONMENT=development,DEBUG=false,LOG_LEVEL=INFO,DATABASE_URL=sqlite:///data/codice_fiscale.sqlite,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXZvbHZpbmctc3RpbmtidWctMjIuY2xlcmsuYWNjb3VudHMuZGV2JA,CLERK_JWKS_URL=https://great-hound-85.clerk.accounts.dev/.well-known/jwks.json"
      - "--update-secrets=SECRET_KEY=CODICE_FISCALE_SECRET_KEY:latest,CLERK_SECRET_KEY=CODICE_FISCALE_CLERK_SECRET_KEY:latest,LOGFIRE_TOKEN=CODICE_FISCALE_LOGFIRE_TOKEN:latest"


images:
  - "europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/codice-fiscale-service"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"
